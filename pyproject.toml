[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbim-hackathon-flow"
version = "0.2.0"
description = "Sporbare stemmeanbefalinger, kontroll og lokal drift"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "coverage>=7,<8"]

[project.scripts]
nbim-flow = "nbim_flow.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["artifacts", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["nbim_flow"]
omit = ["*/ui/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
