name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      NBIM_LOG_LEVEL: ERROR
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Check source and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run offline tests with coverage
        run: |
          python -m coverage run --branch -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml
      - name: Check configuration without model calls
        run: python -m nbim_flow doctor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
